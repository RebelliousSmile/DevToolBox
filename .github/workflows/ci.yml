name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            expected_os: Windows
            expected_arch: X64
          - runner: ubuntu-22.04
            expected_os: Linux
            expected_arch: X64
          - runner: macos-15
            expected_os: macOS
            expected_arch: ARM64
          - runner: macos-15-intel
            expected_os: macOS
            expected_arch: X64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify runner identity
        shell: bash
        run: |
          test "$RUNNER_OS" = "${{ matrix.expected_os }}"
          test "$RUNNER_ARCH" = "${{ matrix.expected_arch }}"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libfuse2
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          test "$(rustc +1.93.0 --version | cut -d' ' -f2)" = "1.93.0"
      - name: Static release configuration
        run: python scripts/verify-package-config.py && python scripts/verify-release-config.py
      - name: Rust quality gates
        shell: bash
        run: |
          cargo +1.93.0 fmt --all -- --check
          cargo +1.93.0 check --all-targets --locked
          cargo +1.93.0 clippy --all-targets --locked -- -D warnings
          cargo +1.93.0 test --all-targets --locked -- --test-threads=1
      - name: Build unsigned release candidate
        run: cargo +1.93.0 build --release --locked
