[package]
name = "winfxstart"
version = "0.1.0"
edition = "2021"
authors = ["RebelliousSmile <contact@rebellioussmile.com>"]
description = "Windows 11 Command Launcher with native Win32 UI"
license = "MIT"

[dependencies]
# Window management
tao = "0.26"

# raw-window-handle 0.6 to extract HWND from the tao window
raw-window-handle = "0.6"

# Windows APIs
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
] }

# Raster image decode and resize (PNG primary; jpg/bmp/gif via allowlist).
# SVG is descoped to a follow-up (Decision D1).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

# JSON storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

[profile.release]
opt-level = 3
lto = true
