[package]
name = "devtoolbox"
version = "0.10.0"
edition = "2021"
authors = ["RebelliousSmile <contact@rebellioussmile.com>"]
description = "Cross-platform command launcher and developer toolbox with a native eframe/egui UI"
license = "MIT"

[dependencies]
# Cross-platform UI (replaces `tao` + Win32 child controls; Part 2 of the
# multi-OS transformation).
eframe = "0.35"
egui = "0.35"

# Raster image decode and resize (PNG primary; jpg/bmp/gif via allowlist).
# SVG is descoped to a follow-up (Decision D1).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

# JSON storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Recursive $HOME walk for the Docker tab's compose-file discovery. Chosen
# over a hand-rolled `std::fs` recursion for one reason: `filter_entry`
# prunes an excluded directory *without descending into it*, which is what
# keeps a `node_modules` or a `.cache` tree from being walked at all.
walkdir = "2.5"

# Native cross-platform folder picker for user-script preferences.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
# Windows APIs
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true

[dev-dependencies]
egui_kittest = { version = "0.35.0", default-features = false }
